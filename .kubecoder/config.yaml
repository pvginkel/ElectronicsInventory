# KubeCoder environment manifest for the Electronics Inventory monorepo.
#
# One primary repository, two components: a Poetry/Flask backend and a pnpm/Vite
# frontend with a Playwright suite. Both toolchains come from the single
# `modern-app` sidecar (Node 24 + pnpm + the Chromium system libraries, plus
# uv/Poetry/Ruff), because the Playwright harness boots the Python backend per
# worker and so needs both toolsets in one container.
#
# Two sidecars beside it. `postgres` is the honcho dev stack's database: the
# backend's code default `DATABASE_URL` points at
# `postgresql+psycopg://…@localhost:5432/electronics_inventory`, and
# `kc project setup` creates that database and applies the migrations. Neither
# test suite uses it — the backend suite runs against in-memory SQLite and the
# Playwright harness seeds a per-worker SQLite file, both by their own
# configuration. S3 attachment storage does need a real endpoint, though — the
# backend test fixtures hard-fail when `S3_ENDPOINT_URL` is unreachable — so a
# MinIO sidecar provides it locally.
# CI does the same thing its own way: the Jenkins validation Job runs a `minio`
# sidecar beside the suite container and injects the same four `S3_*` variables
# (Jenkinsfile, "Run validation").

cwd: ElectronicsInventory

# The spec repository the AI workflow (/dev:onboard, /dev:plan-slice) reads and
# writes. Shared, so one clone is mounted into every environment of this project
# rather than each of them holding its own. It is empty on GitHub today — a
# shared entry with an unborn HEAD clones and mounts fine.
repos:
  - url: https://github.com/pvginkel/ElectronicsInventorySpecs
    path: ElectronicsInventorySpecs
    shared: true

capabilities:
  github: rw

tools:
  - use: modern-app

# S3-compatible object storage for the backend's attachment handling, and the
# PostgreSQL the dev stack stores its data in. Neither is exposed: both are
# reached on localhost from the modern-app sidecar, which is where the suites
# and the dev stack actually run.
services:
  - minio
  - postgres

# The three images CI publishes (electronics-inventory, -ui, -docs) are built by
# Jenkins with `helmCharts.kaniko(...)`, not by `kc project build` — see the
# comment in project.yaml. The builder is on so those Dockerfiles can still be
# proven in-env with a by-hand `kaniko --no-push`.
imageBuilder: true

# Projected from the deployment's secret catalog; the backend's AI helpers need it.
# It arrives as an environment variable, which beats `backend/.env` in
# pydantic-settings, so nothing has to write it to disk.
secrets:
  OPENAI_API_KEY: openai-api-key

# One definition of setup, shared by a fresh pod and any later re-run.
setup:
  - kc project setup

ports:
  - name: frontend
    port: 3000
    type: http
    sslOffload: true
  - name: backend
    port: 3001
    type: http
  - name: sse-gateway
    port: 3002
    type: http

preamble:
  instructions: |
    Electronics Inventory is a monorepo: `backend/` (Flask + SQLAlchemy, Poetry)
    and `frontend/` (React + Vite + TanStack Router, pnpm, Playwright).

    Use `kc project build`, `kc project test` and `kc project lint` rather than
    invoking poetry or pnpm directly; both toolchains live in the `modern-app`
    tool sidecar, so ad-hoc commands need `cexec modern-app ...`.

    The dev runner needs that prefix too — this container has no poetry, pnpm or
    honcho, so it is `cexec modern-app ./scripts/dev.py`, not `./scripts/dev.py`
    (backend :3001, frontend :3000, SSE gateway :3002).

    The backend suite runs on in-memory SQLite and the Playwright suite boots its
    own backend, SSE gateway and frontend per worker, so neither suite touches
    the `postgres` sidecar — that one is the honcho dev stack's database
    (PostgreSQL 18 on localhost:5432, postgres/postgres). S3 attachment storage
    needs a live endpoint — the test fixtures abort when `S3_ENDPOINT_URL` is
    unset or unreachable — and it comes from the `minio` sidecar on
    localhost:9000 (minioadmin/minioadmin). `kc project setup` seeds
    `backend/.env` (database and S3) and `backend/.env.test` (S3), only when
    they do not already exist, so an operator's own files are never overwritten.

    `kc project test` writes a gitignored, multi-megabyte `test_results.md` at
    the repository root — grep it, never read it whole. `kc project lint` and
    `kc project test` also leave `.mypy_cache`, `.pytest_cache` and
    `.ruff_cache` behind; every image build context excludes them, so a build
    after a lint run does not stream them to the builder.

    **The dev stack runs on the `postgres` sidecar.** `DATABASE_URL` defaults to
    `postgresql+psycopg://postgres:postgres@localhost:5432/electronics_inventory`
    and the sidecar answers there. The sidecar starts with only its `postgres`
    maintenance database, so `kc project setup` creates `electronics_inventory`
    (`backend/scripts/init-dev-database.py`) and applies the migrations
    (`cli upgrade-db`); both are idempotent, so a re-run is a no-op. That makes
    `cexec modern-app ./scripts/dev.py` serve data as well as the SPA, with
    `/health/readyz` answering 200 and `database.connected: true`. Both test
    suites are unaffected either way: they use SQLite by their own
    configuration and never touch the sidecar.

    `/work/ElectronicsInventorySpecs` is a *shared* clone mounted into this pod.
    It is not a folder on this environment's own volume, and it is the AI
    workflow's spec repository — not a sibling of the application code.
