# KubeCoder environment manifest for the Electronics Inventory monorepo.
#
# One repository, two components: a Poetry/Flask backend and a pnpm/Vite
# frontend with a Playwright suite. Both toolchains come from the single
# `modern-app` sidecar (Node 24 + pnpm + the Chromium system libraries,
# plus uv/Poetry/Ruff).
#
# No data sidecars: the backend test suite runs against in-memory SQLite, and
# attachment storage points at the shared Ceph RGW S3 endpoint — the same shape
# the CI validation job uses, which runs with no sidecars either.

cwd: ElectronicsInventory

capabilities:
  github: rw

tools:
  - use: modern-app

# Projected from the deployment's secret catalog; the backend's AI helpers need it.
secrets:
  OPENAI_API_KEY: openai-api-key

# One definition of setup, shared by a fresh pod and any later re-run.
setup:
  - kc project setup

ports:
  - name: web
    port: 3000
    type: http
  - name: api
    port: 3001
    type: http

preamble:
  instructions: |
    Electronics Inventory is a monorepo: `backend/` (Flask + SQLAlchemy, Poetry)
    and `frontend/` (React + Vite + TanStack Router, pnpm, Playwright).

    Use `kc project build`, `kc project test` and `kc project lint` rather than
    invoking poetry or pnpm directly; both toolchains live in the `modern-app`
    tool sidecar, so ad-hoc commands need `cexec modern-app ...`.

    Tests need no data services: the backend suite runs on in-memory SQLite and
    the Playwright suite boots its own backend, SSE gateway and frontend per
    worker. S3 attachment storage points at the shared Ceph RGW endpoint via
    `backend/.env` / `backend/.env.test`, which are gitignored and local to the
    environment.

    `./scripts/dev.py` starts the dev stack (backend :3001, frontend :3000,
    SSE gateway :3002) via honcho.
