# KubeCoder environment manifest for the Electronics Inventory monorepo.
#
# One repository, two components: a Poetry/Flask backend and a pnpm/Vite
# frontend with a Playwright suite. Both toolchains come from the single
# `modern-app` sidecar (Node 24 + pnpm + the Chromium system libraries,
# plus uv/Poetry/Ruff).
#
# No database sidecar: the backend test suite runs against in-memory SQLite.
# S3 attachment storage does need a real endpoint, though — the backend test
# fixtures hard-fail when the bucket check fails — so a MinIO sidecar provides
# it locally. CI differs deliberately: the Jenkins validation job talks to the
# shared Ceph RGW endpoint with credentials injected from Vault, which is why it
# needs no sidecar of its own.

cwd: ElectronicsInventory

capabilities:
  github: rw

tools:
  - use: modern-app

# S3-compatible object storage for the backend's attachment handling. Not
# exposed: it is reached on localhost from the modern-app sidecar, which is
# where the suites actually run.
services:
  - minio

# Projected from the deployment's secret catalog; the backend's AI helpers need it.
secrets:
  OPENAI_API_KEY: openai-api-key

# One definition of setup, shared by a fresh pod and any later re-run.
setup:
  - kc project setup

ports:
  - name: frontend
    port: 3000
    type: http
    sslOffload: true
  - name: backend
    port: 3001
    type: http
  - name: sse-gateway
    port: 3002
    type: http

preamble:
  instructions: |
    Electronics Inventory is a monorepo: `backend/` (Flask + SQLAlchemy, Poetry)
    and `frontend/` (React + Vite + TanStack Router, pnpm, Playwright).

    Use `kc project build`, `kc project test` and `kc project lint` rather than
    invoking poetry or pnpm directly; both toolchains live in the `modern-app`
    tool sidecar, so ad-hoc commands need `cexec modern-app ...`.

    The backend suite runs on in-memory SQLite and the Playwright suite boots
    its own backend, SSE gateway and frontend per worker, so there is no
    database sidecar. S3 attachment storage does need a live endpoint — the test
    fixtures abort when the bucket check fails — and it comes from the `minio`
    sidecar on localhost:9000, configured in `backend/.env` / `backend/.env.test`
    (gitignored, local to this environment). CI instead points at the shared
    Ceph RGW endpoint with credentials from Vault.

    `./scripts/dev.py` starts the dev stack (backend :3001, frontend :3000,
    SSE gateway :3002) via honcho.
