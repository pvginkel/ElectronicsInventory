[tool.poetry]
name = "electronics-inventory"
version = "0.1.0"
description = "Monorepo root for the Electronics Inventory backend and frontend"
authors = ["Pieter van Ginkel <pvginkel@gmail.com>"]
packages = [{include = "tools"}]

[tool.poetry.dependencies]
python = "^3.13"
honcho = "^2"
pathspec = "^1"
psutil = "^5"

[tool.poetry.scripts]
run-suite = "tools.suite_runner.local:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
